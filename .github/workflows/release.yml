name: release

# Publish via npm Trusted Publishing (OIDC). No token is stored anywhere and no
# one-time password is typed: npm verifies that this exact workflow, in this exact
# repository, produced the tarball. That matters beyond convenience — npm is
# restricting tokens that bypass 2FA (account changes Aug 2026, direct publishing
# Jan 2027), so a stored token is a path with a known expiry date.
#
# Release = push a tag that matches package.json:
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the runner's bundled one may predate it.
      - run: npm install -g npm@latest

      - name: The tag must be the version, or the registry and the repo disagree forever
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Refuse to ship a version whose own checks do not pass
        run: npm test

      # The published tarball is what users actually get, so assert the two files that
      # make this release meaningful are inside it. 0.2.2 shipped without them and the
      # package could not hand anything off — that failure is what this guard is for.
      - name: The tarball must contain the code that does the work
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map((f) => f.path)
            const required = ['taskpack.js', 'bag.js', 'cli.js', 'mcp.js']
            const missing = required.filter((f) => !files.includes(f))
            if (missing.length) { console.error('missing from tarball: ' + missing.join(', ')); process.exit(1) }
            console.log('tarball ok: ' + files.length + ' files')
          "

      - run: npm publish --provenance --access public
