name: release

# Publish via npm Trusted Publishing (OIDC). No token is stored anywhere and no
# one-time password is typed: npm verifies that this exact workflow, in this exact
# repository, produced the tarball. That matters beyond convenience — npm is
# restricting tokens that bypass 2FA (account changes Aug 2026, direct publishing
# Jan 2027), so a stored token is a path with a known expiry date.
#
# Release = push a tag that matches package.json:
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # contents: write is for the release notes step below. npm itself still publishes
  # through OIDC (id-token), not through this token.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately no registry-url: it writes an .npmrc that expects NODE_AUTH_TOKEN,
      # and trusted publishing has no token to put there. An empty one authenticates
      # as nobody, which fails later and looks like a permissions problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm; the runner's bundled one may predate it.
      - run: npm install -g npm@latest

      - name: The tag must be the version, or the registry and the repo disagree forever
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Refuse to ship a version whose own checks do not pass
        run: npm test

      # The published tarball is what users actually get, so assert every module the
      # entry points import is inside it. 0.2.2 shipped without the handoff code, and
      # 0.3.1 shipped without outbox.js — cli.js and mcp.js import it at the top, so
      # `npx task-passport@0.3.1 --help` died with ERR_MODULE_NOT_FOUND. Read the
      # actual tarball rather than npm's --json report: the report's shape has
      # changed between npm versions, and a guard that breaks when the tool it inspects
      # is upgraded is a guard you will end up deleting.
      - name: The tarball must contain the code that does the work
        run: |
          TGZ="$(npm pack --silent | tail -1)"
          tar -tzf "$TGZ" | sed 's|^package/||' | sort > /tmp/files.txt
          for f in taskpack.js bag.js cli.js mcp.js core.js outbox.js store.js index.js; do
            grep -qx "$f" /tmp/files.txt || { echo "missing from tarball: $f" >&2; exit 1; }
          done
          echo "tarball ok: $(wc -l < /tmp/files.txt) files"
          rm -f "$TGZ"

      - run: npm publish --provenance --access public

      # A published package with no release entry is an audit gap: the tags existed
      # for 0.3.0–0.3.2 but the Releases page still showed 0.2.2. Notes are generated
      # from the commits since the previous tag, so they cannot drift from history.
      - name: Publish the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Task Passport ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
