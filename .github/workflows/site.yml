name: site

# taskpack.org is an identifier before it is a web page: the A2A extension URI and the
# spec URL both point here, so a deploy that silently stops running turns the descriptor
# into a claim about a 404. Build on every push, and let the build itself refuse to
# produce a site that does not back every URL the descriptor claims.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site from docs/ (single source, no second copy of the spec)
        run: node site/build.mjs
      - name: The spec page must actually contain the spec
        run: |
          test -s site/dist/spec/0.1/index.html
          test -s site/dist/spec/0.1.md
          grep -q 'taskpack/0.1' site/dist/spec/0.1/index.html
          node -e "JSON.parse(require('fs').readFileSync('site/dist/a2a/ext/taskpack/v1','utf8'))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
